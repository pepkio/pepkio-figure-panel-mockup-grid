[project]
name = "pepkio-figure-panel-mockup-grid"
version = "0.1.0"
description = "Python client for Pepkio figure-panel-mockup-grid tool"
readme = "README_PYPI.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-figure-panel-mockup-grid = "pepkio_figure_panel_mockup_grid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_figure_panel_mockup_grid"]

[dependency-groups]
dev = [
    "hatchling>=1.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
